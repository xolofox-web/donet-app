<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Alert</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           BASE SETUP
           ========================================= */
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent; 
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: flex-end; /* Muncul dari bawah */
            justify-content: center;
            padding-bottom: 60px;
            pointer-events: none;
            -webkit-font-smoothing: antialiased; 
        }

        /* =========================================
           CONTAINER (CLEAN & SMOOTH)
           ========================================= */
        #alert-container {
            display: none;
            width: 90%;
            max-width: 440px;
            background: rgba(10, 10, 11, 0.95); /* Hitam pekat transparan */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
            
            /* Setup Awal Animasi (Akan dimanipulasi JS) */
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            filter: blur(8px);
        }

        /* Class untuk animasi masuk */
        .anim-in {
            animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Class untuk animasi keluar */
        .anim-out {
            animation: slideOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); filter: blur(8px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        @keyframes slideOut {
            0% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
            100% { opacity: 0; transform: translateY(-10px) scale(0.98); filter: blur(4px); }
        }

        /* =========================================
           CONTENT & TYPOGRAPHY
           ========================================= */
        .alert-content {
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #71717a; /* Zinc-500 */
        }

        .alert-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .donor-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .donor-name {
            font-size: 16px;
            font-weight: 500;
            color: #fafafa; 
            margin: 0;
            letter-spacing: -0.2px;
        }

        .donor-amount {
            font-size: 26px;
            font-weight: 700;
            color: #10b981; /* Emerald-500 */
            margin: 0;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .donor-message {
            font-size: 13px;
            color: #a1a1aa; 
            line-height: 1.5;
            margin: 0;
            font-style: italic;
            border-left: 2px solid rgba(16, 185, 129, 0.3); /* Garis hijau tipis */
            padding-left: 12px;
            /* Smooth transition untuk pesan */
            transition: all 0.3s ease;
        }

        /* =========================================
           PROGRESS BAR (CSS ANIMATION - 60FPS)
           ========================================= */
        #progress-bar-container {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            position: absolute;
            bottom: 0;
            left: 0;
        }

        #progress-bar {
            height: 100%;
            background: #10b981;
            width: 100%;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
            transform-origin: left;
        }

        /* Animasi progress bar pakai CSS biar mulus banget */
        .progress-anim {
            animation: countdown 20s linear forwards;
        }

        @keyframes countdown {
            0% { transform: scaleX(1); }
            100% { transform: scaleX(0); }
        }
    </style>
</head>
<body>

    <div id="alert-container">
        <div class="alert-content">
            
            <div class="alert-header">
                <span>New Support</span>
                <span id="donor-method">QRIS</span>
            </div>

            <div class="alert-main">
                <div class="donor-info">
                    <p class="donor-name" id="donor-name">Budi Santoso</p>
                    <p class="donor-amount">
                        <span id="donor-amount-text">Rp 50.000</span>
                    </p>
                </div>
            </div>

            <div id="message-container">
                <p class="donor-message" id="donor-message">"Semangat terus bang Zyxellvar!"</p>
            </div>

        </div>

        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <script>
        const POLL_INTERVAL = 3000; 
        const DISPLAY_DURATION = 20000; 

        let seenDonationIds = new Set();
        let donationQueue = [];
        let isShowing = false;
        let isFirstLoad = true;

        const alertContainer = document.getElementById('alert-container');
        const progressBar = document.getElementById('progress-bar');
        const donorName = document.getElementById('donor-name');
        const donorAmount = document.getElementById('donor-amount-text');
        const donorMethod = document.getElementById('donor-method');
        const donorMessage = document.getElementById('donor-message');
        const messageContainer = document.getElementById('message-container');

        // ==========================================
        // [FITUR BARU] FUNGSI TEXT-TO-SPEECH (TTS)
        // ==========================================
        function speakDonation(donation) {
            // Cek apakah browser mendukung Speech Synthesis
            if (!('speechSynthesis' in window)) return;
            
            // Hentikan suara sebelumnya jika masih ada agar tidak tumpang tindih
            window.speechSynthesis.cancel();

            let amountText = donation.amount.toLocaleString('id-ID');
            let textToSpeak = `Donasi baru dari ${donation.donor_name}, sebesar ${amountText} Rupiah. `;
            
            if (donation.message && donation.message.trim() !== '') {
                textToSpeak += `Pesan: ${donation.message}`;
            }

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'id-ID'; // Set bahasa Indonesia
            utterance.rate = 1.0;     // Kecepatan bicara normal
            utterance.pitch = 1.0;    // Nada suara normal
            
            window.speechSynthesis.speak(utterance);
        }
        // ==========================================

        async function fetchLatestDonations() {
            try {
                const res = await fetch('/api/latest-donation');
                if (!res.ok) return;
                const data = await res.json();

                if (!Array.isArray(data)) return;

                const newDonations = data.filter(d => !seenDonationIds.has(d.order_id));

                if (isFirstLoad) {
                    data.forEach(d => seenDonationIds.add(d.order_id));
                    isFirstLoad = false;
                    return;
                }

                if (newDonations.length > 0) {
                    newDonations.sort((a, b) => new Date(a.created_at) - new Date(b.created_at)); 
                    
                    newDonations.forEach(d => {
                        seenDonationIds.add(d.order_id);
                        donationQueue.push(d);
                    });

                    processQueue();
                }
            } catch (err) {
                console.error('Polling error:', err);
            }
        }

        function processQueue() {
            if (isShowing || donationQueue.length === 0) return;
            const donation = donationQueue.shift();
            showAlert(donation);
        }

        function showAlert(donation) {
            isShowing = true;

            // 1. Set Data
            donorName.innerText = donation.donor_name || 'Anonim';
            donorAmount.innerText = 'Rp ' + donation.amount.toLocaleString('id-ID');
            donorMethod.innerText = donation.payment_method || 'QRIS';

            // Handle Pesan (Smooth Appearance)
            if (donation.message && donation.message.trim() !== '') {
                donorMessage.innerText = `"${donation.message}"`;
                messageContainer.style.display = 'block';
                // Force reflow for animation
                void messageContainer.offsetWidth; 
                messageContainer.style.opacity = '1';
                messageContainer.style.transform = 'translateY(0)';
            } else {
                messageContainer.style.display = 'none';
                messageContainer.style.opacity = '0';
                messageContainer.style.transform = 'translateY(-5px)';
            }

            // 2. Tampilkan Container
            alertContainer.style.display = 'block';
            alertContainer.classList.remove('anim-out');
            
            // Force reflow agar animasi bisa di-restart
            void alertContainer.offsetWidth; 
            
            alertContainer.classList.add('anim-in');

            // 3. Jalankan Progress Bar (Restart CSS Animation)
            progressBar.classList.remove('progress-anim');
            void progressBar.offsetWidth; 
            progressBar.classList.add('progress-anim');

            // 4. Panggil Suara TTS
            speakDonation(donation);

            // 5. Timer Selesai
            setTimeout(() => {
                // Jalankan animasi keluar
                alertContainer.classList.remove('anim-in');
                alertContainer.classList.add('anim-out');
                
                // Tunggu animasi selesai (0.4 detik), lalu sembunyikan & lanjut antrean
                setTimeout(() => {
                    alertContainer.style.display = 'none';
                    isShowing = false;
                    // Beri jeda sedikit sebelum donasi berikutnya (opsional, biar napas)
                    setTimeout(processQueue, 500); 
                }, 400); 
            }, DISPLAY_DURATION);
        }

        // Mulai
        fetchLatestDonations();
        setInterval(fetchLatestDonations, POLL_INTERVAL);
    </script>
</body>
</html>
