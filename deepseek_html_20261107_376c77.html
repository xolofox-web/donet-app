<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        /* Animasi masuk untuk Card */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animasi getar kalau error */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }

        /* Efek Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- Background Orbs (Lingkaran Cahaya) -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
    <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-indigo-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>

    <!-- Card Login -->
    <div class="glass-panel p-8 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-white w-full max-w-md relative z-10 animate-fade-in-up">
        
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-slate-300 transform rotate-3 hover:rotate-0 transition-transform duration-300">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Admin Login</h1>
            <p class="text-slate-500 text-sm mt-2">Masuk untuk mengelola donasi</p>
        </div>
        
        <!-- Kotak Error -->
        <div id="login-err" class="text-red-600 text-sm text-center mb-6 hidden bg-red-50 py-3 px-4 rounded-xl border border-red-100 font-medium animate-shake"></div>
        
        <form id="form-login" class="space-y-5">
            
            <!-- Input Email -->
            <div>
                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 block">Email Address</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-slate-400 group-focus-within:text-slate-800 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                    </div>
                    <input type="email" id="login-email" required 
                        class="w-full pl-11 pr-4 py-3.5 bg-white/50 border border-slate-200 rounded-xl outline-none focus:border-slate-800 focus:bg-white focus:ring-4 focus:ring-slate-800/10 transition-all duration-300 text-sm font-medium text-slate-800 placeholder-slate-400" 
                        placeholder="admin@email.com">
                </div>
            </div>

            <!-- Input Password -->
            <div>
                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 block">Password</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-slate-400 group-focus-within:text-slate-800 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" id="login-pass" required 
                        class="w-full pl-11 pr-12 py-3.5 bg-white/50 border border-slate-200 rounded-xl outline-none focus:border-slate-800 focus:bg-white focus:ring-4 focus:ring-slate-800/10 transition-all duration-300 text-sm font-medium text-slate-800 placeholder-slate-400" 
                        placeholder="••••••••">
                    
                    <!-- Tombol Toggle Mata -->
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-800 transition-colors focus:outline-none">
                        <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Tombol Masuk -->
            <button type="submit" id="btn-login" 
                class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 hover:shadow-[0_10px_20px_rgba(0,0,0,0.15)] hover:-translate-y-0.5 transition-all duration-300 active:scale-[0.98] mt-6 flex items-center justify-center gap-2 group">
                <span>Masuk ke Dashboard</span>
                <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>

        <!-- [DIHAPUS] Bagian "Kembali ke Halaman Donasi" sudah dihilangkan dari sini -->
        
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // --- 1. FITUR SHOW/HIDE PASSWORD ---
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('login-pass');
            const eyeIcon = document.getElementById('eye-icon');

            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Ganti ikon mata (terbuka/tertutup)
                if (type === 'text') {
                    eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
                } else {
                    eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
                }
            });

            // --- 2. LOGIKA LOGIN ---
            const form = document.getElementById('form-login');
            const btn = document.getElementById('btn-login');
            const errBox = document.getElementById('login-err');

            form.addEventListener('submit', async function(e) {
                e.preventDefault(); 
                
                // Sembunyikan error sebelumnya
                errBox.classList.add('hidden');
                
                // Ubah tombol jadi loading
                const originalBtnHTML = btn.innerHTML;
                btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
                btn.disabled = true;

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: document.getElementById('login-email').value,
                            password: document.getElementById('login-pass').value
                        })
                    });

                    // Baca teks dulu (karena Vercel kadang ngirim HTML kalau error)
                    const textData = await response.text();
                    let data;

                    try {
                        data = JSON.parse(textData);
                    } catch (err) {
                        throw new Error('Server Error: Gagal memproses data dari server.');
                    }

                    if (!response.ok) {
                        // Tampilkan pesan error dari API
                        errBox.innerText = data.error || 'Email atau password salah.';
                        errBox.classList.remove('hidden');
                        // Animasi getar pada kotak error
                        errBox.classList.add('animate-shake');
                        setTimeout(() => errBox.classList.remove('animate-shake'), 500);
                        
                        // Kembalikan tombol ke semula
                        btn.innerHTML = originalBtnHTML;
                        btn.disabled = false;
                        return;
                    }

                    // Jika Sukses
                    localStorage.setItem('admin_token', data.access_token);
                    btn.innerHTML = '<span>Berhasil! Mengalihkan...</span>';
                    // Beri jeda 0.5 detik biar animasi keliatan
                    setTimeout(() => {
                        window.location.href = '/dashboard'; // Menggunakan clean URL
                    }, 500);

                } catch (error) {
                    errBox.innerText = error.message;
                    errBox.classList.remove('hidden');
                    errBox.classList.add('animate-shake');
                    setTimeout(() => errBox.classList.remove('animate-shake'), 500);
                    
                    btn.innerHTML = originalBtnHTML;
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
