<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">Admin Login</h1>
            <p class="text-slate-500 text-sm mt-1">Masuk ke dashboard donasi</p>
        </div>
        
        <p id="login-err" class="text-red-500 text-sm text-center mb-4 hidden bg-red-50 py-2 rounded-lg border border-red-100"></p>
        
        <form id="form-login" class="space-y-5">
            <div>
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2 block">Email</label>
                <input type="email" id="login-email" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-slate-800 focus:ring-2 focus:ring-slate-200 transition-all text-sm" placeholder="admin@email.com">
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2 block">Password</label>
                <input type="password" id="login-pass" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-slate-800 focus:ring-2 focus:ring-slate-200 transition-all text-sm" placeholder="••••••••">
            </div>
            <button type="submit" id="btn-login" class="w-full bg-slate-900 text-white font-semibold py-3.5 rounded-xl hover:bg-slate-800 hover:shadow-lg hover:shadow-slate-300 transition-all active:scale-[0.98] mt-2">Masuk ke Dashboard</button>
        </form>
        
        <div class="text-center mt-6">
            <a href="/" class="text-sm font-medium text-slate-400 hover:text-slate-800 transition-colors">Kembali ke Halaman Donasi</a>
        </div>
    </div>

    <!-- SCRIPT LANGSUNG DI SINI, GAK PAKE FILE LUAR -->
    <script>
        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault(); // Nahan refresh
            
            const btn = document.getElementById('btn-login');
            const errBox = document.getElementById('login-err');
            
            btn.innerText = 'Memproses...';
            btn.disabled = true;
            errBox.classList.add('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-pass').value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    // Kalau gagal, tampilin error
                    errBox.innerText = data.error || 'Email atau password salah.';
                    errBox.classList.remove('hidden');
                    btn.innerText = 'Masuk ke Dashboard';
                    btn.disabled = false;
                    return;
                }

                // Kalau sukses
                alert('Login Berhasil! Mengalihkan ke dashboard...');
                localStorage.setItem('admin_token', data.access_token);
                window.location.href = '/dashboard';

            } catch (error) {
                alert('Error Jaringan: ' + error.message);
                btn.innerText = 'Masuk ke Dashboard';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
