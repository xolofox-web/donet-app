<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow: hidden; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); } 20%, 40%, 60%, 80% { transform: translateX(4px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        
        /* Input OTP biar lebih pas */
        .otp-input {
            letter-spacing: 0.5em !important;
            font-size: 1.5rem !important;
            padding-left: 0.8em !important; 
        }

        /* CSS Toast Notifikasi Smooth */
        .toast-item { 
            transform: translateY(-20px) scale(0.95); 
            opacity: 0; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .toast-item.show { 
            transform: translateY(0) scale(1); 
            opacity: 1; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- [TAMBAHAN] CONTAINER TOAST -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-3 pointer-events-none w-11/12 max-w-sm"></div>

    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
    <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>

    <div class="glass-panel p-8 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-white w-full max-w-md relative z-10 animate-fade-in-up">
        
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-slate-300 transform rotate-3 hover:rotate-0 transition-transform duration-300">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Admin Login</h1>
            <p class="text-slate-500 text-sm mt-2">Masuk untuk mengelola donasi</p>
        </div>
        
        <div id="login-err" class="text-red-600 text-sm text-center mb-6 hidden bg-red-50 py-3 px-4 rounded-xl border border-red-100 font-medium animate-shake"></div>
        
        <form id="form-login" class="space-y-5">
            
            <div id="email-container">
                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 block">Email Address</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-slate-400 group-focus-within:text-slate-800 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                    </div>
                    <input type="email" id="login-email" required class="w-full pl-11 pr-4 py-3.5 bg-white/50 border border-slate-200 rounded-xl outline-none focus:border-slate-800 focus:bg-white focus:ring-4 focus:ring-slate-800/10 transition-all duration-300 text-sm font-medium text-slate-800 placeholder-slate-400" placeholder="admin@email.com">
                </div>
            </div>

            <div id="password-container">
                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2 block">Password</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-slate-400 group-focus-within:text-slate-800 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" id="login-pass" required class="w-full pl-11 pr-12 py-3.5 bg-white/50 border border-slate-200 rounded-xl outline-none focus:border-slate-800 focus:bg-white focus:ring-4 focus:ring-slate-800/10 transition-all duration-300 text-sm font-medium text-slate-800 placeholder-slate-400" placeholder="••••••••">
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-800 transition-colors focus:outline-none">
                        <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 hover:shadow-[0_10px_20px_rgba(0,0,0,0.15)] hover:-translate-y-0.5 transition-all duration-300 active:scale-[0.98] mt-6 flex items-center justify-center gap-2 group">
                <span>Masuk ke Dashboard</span>
                <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // --- [TAMBAHAN] FUNGSI TOAST NOTIFIKASI ---
            function showToast(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                const isSuccess = type === 'success';
                const borderColor = isSuccess ? 'border-emerald-200' : 'border-red-200';
                const iconBg = isSuccess ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600';
                const iconSvg = isSuccess 
                    ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
                    : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

                toast.className = `toast-item bg-white border ${borderColor} p-4 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] flex items-start gap-3 pointer-events-auto`;
                
                toast.innerHTML = `
                    <div class="w-8 h-8 rounded-full ${iconBg} flex items-center justify-center flex-shrink-0">
                        ${iconSvg}
                    </div>
                    <div class="flex-1 pt-1">
                        <p class="text-sm font-medium text-slate-700 leading-snug break-words">${message}</p>
                    </div>
                    <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;
                
                container.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 4000);
            }

            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('login-pass');
            const eyeIcon = document.getElementById('eye-icon');
            const form = document.getElementById('form-login');
            const btn = document.getElementById('btn-login');
            const errBox = document.getElementById('login-err');
            const emailInput = document.getElementById('login-email');
            const passwordContainer = document.getElementById('password-container');

            let currentEmail = '';
            let isOtpMode = false;

            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                if (type === 'text') {
                    eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
                } else {
                    eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
                }
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault(); 
                errBox.classList.add('hidden');
                if (isOtpMode) await verifyOTP();
                else await loginWithPassword();
            });

            async function loginWithPassword() {
                const originalBtnHTML = btn.innerHTML;
                btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
                btn.disabled = true;
                currentEmail = emailInput.value;

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: currentEmail, password: passwordInput.value })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Email atau password salah.');

                    const otpRes = await fetch('/api/send-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: currentEmail })
                    });
                    const otpData = await otpRes.json();
                    if (!otpRes.ok) throw new Error(otpData.error || 'Gagal mengirim OTP.');

                    // [UPDATE] Pake Toast, bukan alert
                    showToast('Kode OTP telah dikirim ke email Anda!', 'success');
                    
                    passwordContainer.style.display = 'none';
                    emailInput.readOnly = true;
                    emailInput.classList.add('bg-gray-100', 'cursor-not-allowed', 'text-gray-500');

                    if (!document.getElementById('otp-input')) {
                        const otpContainer = document.createElement('div');
                        otpContainer.innerHTML = `
                            <div class="flex justify-between items-center mb-2">
                                <label class="text-xs font-bold text-slate-600 uppercase tracking-wider block">Kode OTP</label>
                                <button type="button" id="btn-resend" class="text-xs font-bold text-blue-600 hover:text-blue-800 transition-colors">Kirim Ulang?</button>
                            </div>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <svg class="w-5 h-5 text-slate-400 group-focus-within:text-slate-800 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                                </div>
                                <input type="text" id="otp-input" maxlength="10" required 
                                    class="otp-input w-full pl-11 pr-4 py-3.5 bg-white/50 border border-slate-200 rounded-xl outline-none focus:border-slate-800 focus:bg-white focus:ring-4 focus:ring-slate-800/10 transition-all duration-300 text-center font-bold text-slate-800" 
                                    placeholder="••••••••">
                            </div>
                        `;
                        form.insertBefore(otpContainer, btn);

                        document.getElementById('btn-resend').onclick = async function() {
                            this.innerText = 'Mengirim...';
                            this.disabled = true;
                            try {
                                const res = await fetch('/api/send-otp', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ email: currentEmail })
                                });
                                if (res.ok) {
                                    showToast('Kode OTP baru telah dikirim!', 'success'); // [UPDATE]
                                    document.getElementById('otp-input').value = '';
                                } else {
                                    showToast('Gagal mengirim ulang OTP.', 'error'); // [UPDATE]
                                }
                            } catch (e) { 
                                showToast('Error jaringan.', 'error'); // [UPDATE]
                            }
                            this.innerText = 'Kirim Ulang?';
                            this.disabled = false;
                        };
                    }

                    btn.innerHTML = 'Verifikasi OTP';
                    isOtpMode = true;
                    btn.disabled = false;
                    document.getElementById('otp-input').focus();

                } catch (error) {
                    errBox.innerText = error.message;
                    errBox.classList.remove('hidden');
                    errBox.classList.add('animate-shake');
                    setTimeout(() => errBox.classList.remove('animate-shake'), 500);
                    btn.innerHTML = originalBtnHTML;
                    btn.disabled = false;
                }
            }

            async function verifyOTP() {
                const otpInput = document.getElementById('otp-input');
                const token = otpInput.value.trim();

                if (token.length === 0) {
                    showToast('Masukkan kode OTP terlebih dahulu.', 'error'); // [UPDATE]
                    return;
                }

                btn.innerHTML = 'Memverifikasi...';
                btn.disabled = true;

                try {
                    const response = await fetch('/api/verify-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: currentEmail, token: token })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Kode OTP salah atau kedaluwarsa.');

                    localStorage.setItem('admin_token', data.access_token);
                    btn.innerHTML = '<span>Berhasil! Mengalihkan...</span>';
                    setTimeout(() => { window.location.href = '/dashboard'; }, 500);

                } catch (error) {
                    errBox.innerText = error.message;
                    errBox.classList.remove('hidden');
                    errBox.classList.add('animate-shake');
                    setTimeout(() => errBox.classList.remove('animate-shake'), 500);
                    btn.innerHTML = 'Verifikasi OTP';
                    btn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
