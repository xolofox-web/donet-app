<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        /* Efek Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Animasi muncul untuk kartu */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-animate {
            opacity: 0;
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Animasi loading muter */
        .spinner { border: 3px solid rgba(0,0,0,0.1); width: 24px; height: 24px; border-radius: 50%; border-left-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 relative">

    <!-- Background Orbs -->
    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob pointer-events-none"></div>
    <div class="fixed top-[20%] right-[-10%] w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000 pointer-events-none"></div>

    <div class="w-full max-w-3xl mx-auto relative z-10">
        
        <!-- Header -->
        <div class="glass-panel flex justify-between items-center mb-8 p-6 rounded-[1.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Dashboard Admin</h1>
                <p class="text-slate-500 text-sm mt-1">Pantau donasi dan kelola akses</p>
            </div>
            <button id="btn-logout" class="text-sm font-bold text-red-600 bg-red-50 border border-red-100 hover:bg-red-100 hover:shadow-md px-5 py-2.5 rounded-xl transition-all duration-300 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Logout
            </button>
        </div>

        <!-- Form Tambah User (Modern Card) -->
        <div class="glass-panel p-6 rounded-[1.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white mb-8 relative overflow-hidden group">
            <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-500 rounded-l-[1.5rem]"></div>
            <h2 class="text-sm font-bold text-slate-800 mb-4 uppercase tracking-wider flex items-center gap-2">
                <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                Tambah Akses Admin Baru
            </h2>
            <form id="form-add-user" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                        </div>
                        <input type="email" id="new-email" required class="w-full pl-10 pr-4 py-3 bg-white/50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all duration-300 text-sm" placeholder="Email admin baru...">
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <input type="text" id="new-username" required class="w-full pl-10 pr-4 py-3 bg-white/50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all duration-300 text-sm" placeholder="Username (Nama Panggilan)">
                    </div>
                </div>
                <button type="submit" id="btn-add-user" class="w-full md:w-auto bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 hover:shadow-[0_8px_20px_rgba(37,99,235,0.3)] hover:-translate-y-0.5 transition-all duration-300 active:scale-[0.98] flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Tambah Akses
                </button>
            </form>
        </div>

        <!-- List Donasi (Card Layout) -->
        <div class="space-y-4">
            <h2 class="text-sm font-bold text-slate-800 mb-2 uppercase tracking-wider px-2 flex items-center gap-2">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                Riwayat Donasi
            </h2>
            
            <div id="donation-list" class="space-y-4">
                <!-- Loading State -->
                <div class="glass-panel flex justify-center items-center py-12 rounded-[1.5rem] border border-white">
                    <div class="spinner mr-3"></div>
                    <span class="text-slate-500 font-medium">Memuat data...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIKA JS -->
    <script>
        const token = localStorage.getItem('admin_token');
        if (!token) window.location.href = '/login';

        document.getElementById('btn-logout').onclick = () => {
            localStorage.removeItem('admin_token');
            window.location.href = '/login';
        };

        // --- FUNGSI LOAD DATA DONASI ---
        async function loadDash() {
            const container = document.getElementById('donation-list');
            try {
                const res = await fetch('/api/get-donations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const textData = await res.text();
                let data;

                try {
                    data = JSON.parse(textData);
                } catch (e) {
                    throw new Error('Server Error (Bukan JSON): ' + textData.substring(0, 50) + '...');
                }

                if (!res.ok || data.error) {
                    throw new Error(data.error || 'Gagal mengambil data');
                }

                if (!Array.isArray(data)) {
                    throw new Error('Format data tidak valid');
                }
                
                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="glass-panel text-center py-16 rounded-[1.5rem] border border-white">
                            <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                            </div>
                            <h3 class="text-lg font-bold text-slate-700 mb-1">Belum Ada Donasi</h3>
                            <p class="text-slate-500 text-sm">Data donasi yang masuk akan muncul di sini.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = ''; // Kosongkan loading
                
                // Render data dengan efek animasi berurutan
                data.forEach((d, index) => {
                    const isSettled = d.status === 'SETTLED';
                    const isFailed = d.status === 'FAILED';
                    
                    let badgeClass, dotClass, statusText;
                    
                    if (isSettled) {
                        badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                        dotClass = 'bg-emerald-500';
                        statusText = 'BERHASIL';
                    } else if (isFailed) {
                        badgeClass = 'bg-red-50 text-red-700 border-red-200';
                        dotClass = 'bg-red-500';
                        statusText = 'GAGAL';
                    } else {
                        badgeClass = 'bg-amber-50 text-amber-700 border-amber-200';
                        dotClass = 'bg-amber-500';
                        statusText = 'PENDING';
                    }
                    
                    const date = new Date(d.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                    // Animasi delay berdasarkan index
                    const animationDelay = `${index * 0.1}s`;

                    container.innerHTML += `
                        <div class="card-animate glass-panel p-5 rounded-[1.5rem] border border-white shadow-[0_4px_20px_rgb(0,0,0,0.03)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300" style="animation-delay: ${animationDelay}">
                            <div class="flex justify-between items-start mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 font-bold text-lg">
                                        ${d.donor_name.charAt(0).toUpperCase()}
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-slate-800 text-lg">${d.donor_name}</h3>
                                        <p class="text-xs text-slate-500">${d.donor_email}</p>
                                    </div>
                                </div>
                                <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] font-bold border ${badgeClass} shadow-sm">
                                    <span class="w-1.5 h-1.5 rounded-full ${dotClass} animate-pulse"></span>
                                    ${statusText}
                                </span>
                            </div>
                            
                            <div class="flex justify-between items-end bg-slate-50/50 p-3 rounded-xl border border-slate-100">
                                <div>
                                    <p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1 font-semibold">Total Donasi</p>
                                    <p class="font-bold text-blue-600 text-xl">Rp ${d.amount.toLocaleString('id-ID')}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1 font-semibold">Waktu</p>
                                    <p class="text-xs font-semibold text-slate-600">${date}</p>
                                </div>
                            </div>
                            
                            ${d.message ? `
                            <div class="mt-3 bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex gap-2 items-start">
                                <svg class="w-4 h-4 text-slate-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                <p class="text-xs text-slate-600 italic leading-relaxed">"${d.message}"</p>
                            </div>
                            ` : ''}
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = `
                    <div class="bg-red-50 text-center py-10 rounded-[1.5rem] border border-red-200 shadow-sm">
                        <svg class="w-12 h-12 text-red-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="text-red-600 font-bold text-sm mb-1">Gagal Memuat Data</p>
                        <p class="text-red-500 text-xs">${error.message}</p>
                    </div>
                `;
            }
        }

        // --- FUNGSI TAMBAH USER ---
        document.getElementById('form-add-user').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-add-user');
            const originalHTML = btn.innerHTML;
            
            btn.innerHTML = '<svg class="animate-spin h-5 w-5 mx-auto text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
            btn.disabled = true;

            try {
                const res = await fetch('/api/add-user', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ 
                        email: document.getElementById('new-email').value,
                        username: document.getElementById('new-username').value
                    })
                });
                
                const result = await res.json();

                if (res.ok) { 
                    // Animasi sukses (bisa diganti alert atau toast)
                    btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Berhasil!';
                    btn.classList.replace('bg-blue-600', 'bg-emerald-500');
                    btn.classList.replace('hover:bg-blue-700', 'hover:bg-emerald-600');
                    e.target.reset(); 
                    
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                        btn.classList.replace('bg-emerald-500', 'bg-blue-600');
                        btn.classList.replace('hover:bg-emerald-600', 'hover:bg-blue-700');
                        btn.disabled = false;
                    }, 2000);
                    
                } else { 
                    alert('Gagal: ' + (result.error || 'Terjadi kesalahan sistem')); 
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Error Jaringan: ' + err.message);
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        };

        // Panggil fungsi load saat halaman dibuka
        loadDash();
    </script>
</body>
</html>
