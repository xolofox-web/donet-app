<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid white; }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.85); border-color: #334155; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card-animate { opacity: 0; animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); width: 24px; height: 24px; border-radius: 50%; border-left-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* CSS Toast Notifikasi */
        .toast-item { 
            transform: translateY(-20px) scale(0.95); 
            opacity: 0; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .toast-item.show { 
            transform: translateY(0) scale(1); 
            opacity: 1; 
        }

        /* CSS Chat Admin */
        .admin-chat-panel { 
            transform: translateY(20px) scale(0.95); 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-origin: bottom right;
        }
        .admin-chat-panel.show { 
            transform: translateY(0) scale(1); 
            opacity: 1; 
            pointer-events: auto; 
        }
        
        #admin-chat-messages::-webkit-scrollbar { width: 5px; }
        #admin-chat-messages::-webkit-scrollbar-track { background: transparent; }
        #admin-chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Animasi Bubble Chat Masuk */
        @keyframes chatMsgPop {
            0% { opacity: 0; transform: translateY(15px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .chat-bubble { 
            opacity: 0;
            animation: chatMsgPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen p-4 md:p-8 relative transition-colors duration-300">

    <!-- CONTAINER TOAST -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-3 pointer-events-none w-11/12 max-w-sm"></div>

    <!-- Background Orbs -->
    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 pointer-events-none"></div>
    <div class="fixed top-[20%] right-[-10%] w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 pointer-events-none"></div>

    <div class="w-full max-w-5xl mx-auto relative z-10">
        
        <!-- Header -->
        <div class="glass-panel flex justify-between items-center mb-6 p-6 rounded-[1.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 dark:text-white">Dashboard Admin</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Pantau donasi dan kelola akses</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="theme-toggle" class="p-2.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-200 transition-colors">
                    <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
                <button id="btn-logout" class="text-sm font-bold text-red-600 bg-red-50 dark:bg-red-900/30 border border-red-100 dark:border-red-800 hover:bg-red-100 px-5 py-2.5 rounded-xl transition-all duration-300 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Logout
                </button>
            </div>
        </div>

        <!-- BARIS 1: GRAFIK & SETTINGS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="glass-panel p-6 rounded-[1.5rem] shadow-sm">
                <h2 class="text-sm font-bold text-slate-800 dark:text-white mb-4 uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                    Statistik 7 Hari Terakhir
                </h2>
                <div class="relative h-48 w-full">
                    <canvas id="donationChart"></canvas>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-[1.5rem] shadow-sm">
                <h2 class="text-sm font-bold text-slate-800 dark:text-white mb-4 uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Pengaturan Web
                </h2>
                <form id="form-settings" class="space-y-3">
                    <div>
                        <label class="text-xs text-slate-500 dark:text-slate-400 mb-1 block">Judul Web</label>
                        <input type="text" id="set-title" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 text-sm dark:text-white" placeholder="Contoh: Dukung Kreator">
                    </div>
                    <div>
                        <label class="text-xs text-slate-500 dark:text-slate-400 mb-1 block">Target Donasi (Rp)</label>
                        <input type="number" id="set-target" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 text-sm dark:text-white" placeholder="Contoh: 10000000">
                    </div>
                    <button type="submit" id="btn-save-settings" class="w-full bg-slate-800 dark:bg-slate-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold hover:bg-slate-900 transition-colors mt-2">Simpan Pengaturan</button>
                </form>
            </div>
        </div>

        <!-- [FITUR BARU] LIVE CHAT SESSION TABLE -->
        <div class="glass-panel p-6 rounded-[1.5rem] shadow-sm mb-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1.5 h-full bg-emerald-500 rounded-l-[1.5rem]"></div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-slate-800 dark:text-white uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                    Pesan Masuk (Live Chat)
                </h2>
                <span id="chat-badge" class="bg-gray-100 dark:bg-slate-800 text-gray-500 text-xs font-bold px-2.5 py-1 rounded-lg">0 Sesi</span>
            </div>
            
            <!-- List Sesi Chat (KOSONG SECARA DEFAULT) -->
            <div id="admin-chat-list" class="space-y-2">
                <!-- Empty State -->
                <div id="empty-chat-state" class="text-center py-8 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-dashed border-slate-200 dark:border-slate-700">
                    <svg class="w-10 h-10 text-slate-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    <p class="text-sm text-slate-400 font-medium">Belum ada pengguna yang memulai chat.</p>
                </div>
            </div>
        </div>

        <!-- BARIS 2: TAMBAH USER -->
        <div class="glass-panel p-6 rounded-[1.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-8 relative overflow-hidden group">
            <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-500 rounded-l-[1.5rem]"></div>
            <h2 class="text-sm font-bold text-slate-800 dark:text-white mb-4 uppercase tracking-wider flex items-center gap-2">
                <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                Tambah Akses Admin Baru
            </h2>
            <form id="form-add-user" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="email" id="new-email" required class="w-full px-4 py-3 bg-white/50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 text-sm dark:text-white" placeholder="Email admin baru...">
                <input type="password" id="new-password" required minlength="6" class="w-full px-4 py-3 bg-white/50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:border-blue-500 text-sm dark:text-white" placeholder="Password (min. 6 karakter)">
                <button type="submit" id="btn-add-user" class="w-full bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Tambah Akses
                </button>
            </form>
        </div>

        <!-- BARIS 3: LIST DONASI -->
        <div class="space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 px-2">
                <h2 class="text-sm font-bold text-slate-800 dark:text-white uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    Riwayat Donasi
                </h2>
                <div class="flex flex-wrap gap-2 w-full md:w-auto">
                    <input type="text" id="search-input" class="flex-1 md:w-40 px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:border-blue-500 dark:text-white" placeholder="Cari Nama / ID...">
                    
                    <select id="filter-date" class="px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:border-blue-500 dark:text-white">
                        <option value="ALL">Semua Waktu</option>
                        <option value="TODAY">Hari Ini</option>
                        <option value="WEEK">Minggu Ini</option>
                        <option value="MONTH">Bulan Ini</option>
                    </select>

                    <select id="filter-status" class="px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm outline-none focus:border-blue-500 dark:text-white">
                        <option value="ALL">Semua Status</option>
                        <option value="SETTLED">Berhasil</option>
                        <option value="PENDING">Pending</option>
                        <option value="FAILED">Gagal</option>
                    </select>
                    <button id="btn-export" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1.5 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Export
                    </button>
                </div>
            </div>
            
            <div id="donation-list" class="space-y-4">
                <div class="glass-panel flex justify-center items-center py-12 rounded-[1.5rem]">
                    <div class="spinner mr-3"></div>
                    <span class="text-slate-500 font-medium">Memuat data...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ADMIN LIVE CHAT PANEL (MENGAMBANG) -->
    <!-- ========================================== -->
    <div id="admin-chat-panel" class="fixed bottom-6 right-6 z-[110] w-[350px] max-w-[calc(100vw-2rem)] bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col overflow-hidden admin-chat-panel" style="height: 500px;">
        
        <!-- Header Admin Chat -->
        <div class="bg-slate-100 dark:bg-slate-900 p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div id="admin-chat-avatar" class="w-10 h-10 bg-slate-300 dark:bg-slate-700 rounded-full flex items-center justify-center text-slate-600 dark:text-slate-300 font-bold">U</div>
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-slate-900 rounded-full"></div>
                </div>
                <div>
                    <h3 id="admin-chat-name" class="text-sm font-bold text-slate-800 dark:text-white">User</h3>
                    <p class="text-[10px] text-slate-500 dark:text-slate-400">Online</p>
                </div>
            </div>
            <button onclick="closeAdminChat()" class="text-slate-400 hover:text-slate-600 p-2 bg-slate-200 dark:bg-slate-800 rounded-full">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Chat Area Admin -->
        <div id="admin-chat-messages" class="flex-1 p-4 overflow-y-auto bg-slate-50 dark:bg-slate-900 space-y-4 flex flex-col">
            <!-- Pesan akan dimuat lewat JS -->
        </div>

        <!-- Input Area Admin -->
        <div class="p-3 bg-white dark:bg-slate-800 border-t border-slate-100 dark:border-slate-700">
            <div class="relative flex items-center">
                <input type="text" id="admin-chat-input" placeholder="Balas pesan..." class="w-full pl-4 pr-12 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-full text-sm outline-none focus:border-slate-800 dark:text-white transition-all">
                <button onclick="sendAdminReply()" class="absolute right-2 w-9 h-9 bg-slate-800 text-white rounded-full flex items-center justify-center hover:bg-slate-700 transition-colors">
                    <svg class="w-4 h-4 transform rotate-45 -ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 9 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- LOGIKA JS UTAMA DASHBOARD -->
    <script>
        const token = localStorage.getItem('admin_token');
        if (!token) window.location.href = '/login';

        // --- FUNGSI TOAST ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const isSuccess = type === 'success';
            const borderColor = isSuccess ? 'border-emerald-200' : 'border-red-200';
            const iconBg = isSuccess ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600';
            const iconSvg = isSuccess 
                ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
                : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

            toast.className = `toast-item bg-white dark:bg-slate-800 border ${borderColor} dark:border-slate-700 p-4 rounded-2xl shadow-xl flex items-start gap-3 pointer-events-auto`;
            toast.innerHTML = `
                <div class="w-8 h-8 rounded-full ${iconBg} flex items-center justify-center flex-shrink-0">${iconSvg}</div>
                <div class="flex-1 pt-1"><p class="text-sm font-medium text-slate-700 dark:text-slate-200 leading-snug break-words">${message}</p></div>
                <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 4000);
        }

        document.getElementById('btn-logout').onclick = () => {
            localStorage.removeItem('admin_token');
            window.location.href = '/login';
        };

        // --- DARK MODE ---
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
        }
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
                themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
            } else {
                localStorage.setItem('theme', 'light');
                themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
            }
            if (allDonations.length > 0) updateChart(allDonations);
        });

        let allDonations = [];
        let previousDataString = '';
        let chartInstance = null;

        // --- LOAD DATA DONASI ---
        async function loadDash(isBackground = false) {
            const container = document.getElementById('donation-list');
            try {
                const res = await fetch('/api/admin?action=donations', { headers: { 'Authorization': `Bearer ${token}` } });
                const textData = await res.text();
                let data;
                try { data = JSON.parse(textData); } catch (e) { throw new Error('Bukan JSON: ' + textData.substring(0, 50)); }
                if (!res.ok || data.error) throw new Error(data.error || 'Gagal mengambil data');
                if (!Array.isArray(data)) throw new Error('Format data tidak valid');
                
                const currentDataString = JSON.stringify(data);
                if (isBackground && currentDataString === previousDataString) return;
                previousDataString = currentDataString;
                allDonations = data;

                renderList(); 
                updateChart(allDonations); 
            } catch (error) {
                if (error.message.includes('JWT expired') || error.message.includes('PGRST303') || error.message.includes('401')) {
                    localStorage.removeItem('admin_token'); showToast('Sesi login berakhir. Silakan login ulang.', 'error'); setTimeout(() => window.location.href = '/login', 1500); return;
                }
                if (!isBackground) {
                    container.innerHTML = `<div class="bg-red-50 text-center py-10 rounded-[1.5rem] border border-red-200 shadow-sm"><p class="text-red-600 font-bold text-sm mb-1">Gagal Memuat Data</p><p class="text-red-500 text-xs">${error.message}</p></div>`;
                }
            }
        }

        // --- RENDER LIST ---
        function renderList() {
            const container = document.getElementById('donation-list');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;
            const dateFilter = document.getElementById('filter-date').value;

            const now = new Date();
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

            const filteredData = allDonations.filter(d => {
                const matchSearch = d.donor_name.toLowerCase().includes(searchQuery) || d.order_id.toLowerCase().includes(searchQuery);
                const matchStatus = statusFilter === 'ALL' || d.status === statusFilter;
                
                const donDate = new Date(d.created_at);
                let matchDate = true;
                if (dateFilter === 'TODAY') matchDate = donDate >= startOfDay;
                if (dateFilter === 'WEEK') matchDate = donDate >= startOfWeek;
                if (dateFilter === 'MONTH') matchDate = donDate >= startOfMonth;

                return matchSearch && matchStatus && matchDate;
            });

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="glass-panel text-center py-10 rounded-[1.5rem]"><p class="text-slate-500 dark:text-slate-400">Data tidak ditemukan.</p></div>`;
                return;
            }

            container.innerHTML = '';
            filteredData.forEach((d, index) => {
                const isSettled = d.status === 'SETTLED';
                const isFailed = d.status === 'FAILED';
                let badgeClass = isSettled ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : (isFailed ? 'bg-red-50 text-red-700 border-red-200' : 'bg-amber-50 text-amber-700 border-amber-200');
                let dotClass = isSettled ? 'bg-emerald-500' : (isFailed ? 'bg-red-500' : 'bg-amber-500');
                const date = new Date(d.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

                let actionButtons = '';
                if (!isSettled) {
                    actionButtons += `<button onclick="manualSettle('${d.order_id}')" class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded hover:bg-emerald-100 transition-colors">Set Lunas</button>`;
                }
                actionButtons += `<button onclick="deleteDonation('${d.order_id}')" class="text-[10px] font-bold text-red-600 bg-red-50 px-2 py-1 rounded hover:bg-red-100 transition-colors ml-2">Hapus</button>`;

                container.innerHTML += `
                    <div class="card-animate glass-panel p-5 rounded-[1.5rem] border border-white dark:border-slate-700 shadow-sm" style="animation-delay: ${index * 0.05}s">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 font-bold text-lg">
                                    ${d.donor_name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800 dark:text-white text-lg">${d.donor_name}</h3>
                                    <p class="text-xs text-slate-500 dark:text-slate-400">${d.donor_email} • <span class="font-bold text-blue-500">${d.payment_method || 'QRIS'}</span></p>
                                </div>
                            </div>
                            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[10px] font-bold border ${badgeClass} shadow-sm">
                                <span class="w-1.5 h-1.5 rounded-full ${dotClass} animate-pulse"></span>${d.status}
                            </span>
                        </div>
                        <div class="flex justify-between items-end bg-slate-50/50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700 mb-3">
                            <div>
                                <p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1 font-semibold">Total Donasi</p>
                                <p class="font-bold text-blue-600 dark:text-blue-400 text-xl">Rp ${d.amount.toLocaleString('id-ID')}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1 font-semibold">Waktu</p>
                                <p class="text-xs font-semibold text-slate-600 dark:text-slate-400">${date}</p>
                            </div>
                        </div>
                        <div class="flex justify-end border-t border-slate-100 dark:border-slate-700 pt-2">
                            ${actionButtons}
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('search-input').addEventListener('input', renderList);
        document.getElementById('filter-status').addEventListener('change', renderList);
        document.getElementById('filter-date').addEventListener('change', renderList);

        window.manualSettle = async function(orderId) {
            if (!confirm('Tandai transaksi ini sebagai LUNAS?')) return;
            try {
                const res = await fetch(`/api/admin?action=update-donation&order_id=${orderId}&do=settle`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) { showToast('Transaksi berhasil ditandai lunas!', 'success'); loadDash(); }
                else { throw new Error('Gagal update status'); }
            } catch (e) { showToast(e.message, 'error'); }
        }

        window.deleteDonation = async function(orderId) {
            if (!confirm('Yakin ingin menghapus data transaksi ini secara permanen?')) return;
            try {
                const res = await fetch(`/api/admin?action=update-donation&order_id=${orderId}&do=delete`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) { showToast('Data berhasil dihapus!', 'success'); loadDash(); }
                else { throw new Error('Gagal menghapus data'); }
            } catch (e) { showToast(e.message, 'error'); }
        }

        // --- UPDATE CHART ---
        function updateChart(data) {
            const ctx = document.getElementById('donationChart').getContext('2d');
            const labels = [];
            const amounts = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
                labels.push(dateStr);
                const dailyTotal = data.filter(don => {
                    const donDate = new Date(don.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
                    return don.status === 'SETTLED' && donDate === dateStr;
                }).reduce((sum, don) => sum + don.amount, 0);
                amounts.push(dailyTotal);
            }

            if (chartInstance) chartInstance.destroy();
            const isDark = document.documentElement.classList.contains('dark');
            Chart.defaults.color = isDark ? '#94a3b8' : '#64748b';

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Donasi', data: amounts, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true, tension: 0.4, borderWidth: 2, pointBackgroundColor: '#3b82f6'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: isDark ? '#334155' : '#f1f5f9' } }, x: { grid: { display: false } } } }
            });
        }

        // --- EXPORT CSV ---
        document.getElementById('btn-export').onclick = () => {
            if (allDonations.length === 0) return showToast('Belum ada data untuk di-export.', 'error');
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "ID Transaksi,Nama,Email,Metode,Nominal,Status,Waktu\n";
            allDonations.forEach(d => { csvContent += `${d.order_id},${d.donor_name},${d.donor_email},${d.payment_method || 'QRIS'},${d.amount},${d.status},${d.created_at}\n`; });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "data_donasi.csv");
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        // --- SETTINGS ---
        async function loadSettingsAdmin() {
            try {
                const res = await fetch('/api/get-info?type=settings');
                const data = await res.json();
                document.getElementById('set-title').value = data.title || 'Dukung Kreator';
                document.getElementById('set-target').value = data.target_amount || 10000000;
            } catch (e) { console.log('Gagal load settings'); }
        }
        loadSettingsAdmin();

        document.getElementById('form-settings').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-save-settings');
            const originalText = btn.innerText;
            btn.innerText = 'Menyimpan...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/api/admin?action=update-settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ 
                        title: document.getElementById('set-title').value,
                        target_amount: parseInt(document.getElementById('set-target').value)
                    })
                });
                const textData = await res.text();
                let result;
                try { result = JSON.parse(textData); } catch (err) { throw new Error('API update-settings gagal/belum ada.'); }
                
                if(res.ok) { showToast('Pengaturan berhasil disimpan!', 'success'); } 
                else { showToast('Gagal: ' + (result.error || 'Terjadi kesalahan sistem'), 'error'); }
            } catch (err) { showToast(err.message, 'error'); } 
            finally { btn.innerText = originalText; btn.disabled = false; }
        };

        // --- TAMBAH USER ---
        document.getElementById('form-add-user').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-add-user');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<svg class="animate-spin h-5 w-5 mx-auto text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin?action=add-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ email: document.getElementById('new-email').value, password: document.getElementById('new-password').value })
                });
                const result = await res.json();
                
                if (res.ok) { 
                    showToast('Admin baru berhasil ditambahkan!', 'success');
                    btn.innerHTML = 'Berhasil!'; btn.classList.replace('bg-blue-600', 'bg-emerald-500'); e.target.reset(); 
                    setTimeout(() => { btn.innerHTML = originalHTML; btn.classList.replace('bg-emerald-500', 'bg-blue-600'); btn.disabled = false; }, 2000);
                } else { 
                    showToast('Gagal: ' + (result.error || 'Kesalahan sistem'), 'error');
                    btn.innerHTML = originalHTML; btn.disabled = false;
                }
            } catch (err) { 
                showToast('Error Jaringan: ' + err.message, 'error');
                btn.innerHTML = originalHTML; btn.disabled = false; 
            }
        };

        // ==========================================
        // [FITUR BARU] LOGIKA REAL-TIME ADMIN CHAT PANEL
        // ==========================================
        
        let previousChatSessions = '';
        let activeSessionId = null;
        let chatPollingInterval = null;
        let lastAdminMsgCount = 0;

        async function loadChatSessions() {
            try {
                const res = await fetch('/api/admin?action=chat-sessions', { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                
                if (!res.ok) return; 
                
                const sessions = await res.json();
                const stringData = JSON.stringify(sessions);
                
                if (stringData === previousChatSessions) return;
                previousChatSessions = stringData;

                const listContainer = document.getElementById('admin-chat-list');
                const emptyState = document.getElementById('empty-chat-state');
                const badge = document.getElementById('chat-badge');

                if (sessions.length === 0) {
                    emptyState.style.display = 'block';
                    badge.innerText = '0 Sesi';
                    badge.className = 'bg-gray-100 dark:bg-slate-800 text-gray-500 text-xs font-bold px-2.5 py-1 rounded-lg';
                    Array.from(listContainer.children).forEach(child => {
                        if (child.id !== 'empty-chat-state') child.remove();
                    });
                    return;
                }

                emptyState.style.display = 'none';
                badge.innerText = `${sessions.length} Sesi Aktif`;
                badge.className = 'bg-emerald-100 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-lg';

                Array.from(listContainer.children).forEach(child => {
                    if (child.id !== 'empty-chat-state') child.remove();
                });

                sessions.forEach(session => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl cursor-pointer hover:border-emerald-500 transition-all group animate-[fadeInUp_0.5s_ease-out]';
                    // Mengirimkan ID dan Nama ke fungsi openAdminChat
                    div.onclick = () => openAdminChat(session.id, session.user_name);
                    div.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="relative">
                                <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-sm">${session.user_name.charAt(0).toUpperCase()}</div>
                                <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-slate-900 rounded-full"></div>
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-white text-sm group-hover:text-emerald-600 transition-colors">${session.user_name}</h3>
                                <p class="text-xs text-slate-500 truncate max-w-[200px]">Klik untuk membalas</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] text-slate-400">${new Date(session.created_at).toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                    `;
                    listContainer.appendChild(div);
                });

            } catch (error) {
                console.error('Gagal load chat sessions:', error);
            }
        }

        function openAdminChat(sessionId, userName) {
            activeSessionId = sessionId;
            lastAdminMsgCount = 0; 
            
            document.getElementById('admin-chat-name').innerText = userName;
            document.getElementById('admin-chat-avatar').innerText = userName.charAt(0).toUpperCase();
            
            const chatArea = document.getElementById('admin-chat-messages');
            chatArea.innerHTML = '<div class="text-center text-xs text-slate-400 mt-4 italic">Memuat pesan...</div>';
            
            const panel = document.getElementById('admin-chat-panel');
            panel.classList.add('show');

            loadAdminMessages(); 

            if (chatPollingInterval) clearInterval(chatPollingInterval);
            chatPollingInterval = setInterval(loadAdminMessages, 3000);
        }

        async function loadAdminMessages() {
            if (!activeSessionId) return;
            try {
                const res = await fetch(`/api/admin?action=get-messages&session_id=${activeSessionId}`);
                const messages = await res.json(); // Selalu coba parse JSON
                
                const chatArea = document.getElementById('admin-chat-messages');
                
                if (!res.ok) {
                    throw new Error(messages.error || 'Gagal memuat pesan dari server');
                }

                // Cek apakah ini loading pertama, atau ada pesan baru
                const isFirstLoad = chatArea.innerHTML.includes('Memuat pesan') || chatArea.innerHTML.includes('Error');

                if (isFirstLoad || messages.length !== lastAdminMsgCount) {
                    lastAdminMsgCount = messages.length;
                    chatArea.innerHTML = '';
                    
                    if (messages.length === 0) {
                        chatArea.innerHTML = '<div class="text-center text-xs text-slate-400 mt-4 italic">Belum ada pesan.</div>';
                    } else {
                        messages.forEach(msg => {
                            const isAdmin = msg.sender === 'admin';
                            const bubble = document.createElement('div');
                            bubble.className = `flex flex-col ${isAdmin ? 'items-end self-end' : 'items-start self-start'} max-w-[85%] chat-bubble`;
                            bubble.innerHTML = `
                                <div class="${isAdmin ? 'bg-slate-800 dark:bg-blue-600 text-white rounded-tr-sm' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-white rounded-tl-sm'} px-4 py-2.5 rounded-2xl text-sm shadow-md leading-relaxed">
                                    ${msg.message}
                                </div>
                                <span class="text-[10px] text-slate-400 mt-1 ${isAdmin ? 'mr-1' : 'ml-1'}">${isAdmin ? 'Anda (Admin)' : document.getElementById('admin-chat-name').innerText}</span>
                            `;
                            chatArea.appendChild(bubble);
                        });
                    }
                    chatArea.scrollTop = chatArea.scrollHeight;
                }
            } catch (e) {
                console.error("Gagal load pesan admin:", e);
                document.getElementById('admin-chat-messages').innerHTML = `<div class="text-center text-xs text-red-500 mt-4 px-4 leading-relaxed">Error: ${e.message}.<br>Pastikan tabel "messages" sudah dibuat di Supabase.</div>`;
            }
        }

        function closeAdminChat() {
            const panel = document.getElementById('admin-chat-panel');
            panel.classList.remove('show');
            activeSessionId = null;
            if (chatPollingInterval) {
                clearInterval(chatPollingInterval);
                chatPollingInterval = null;
            }
        }

        async function sendAdminReply() {
            const input = document.getElementById('admin-chat-input');
            const message = input.value.trim();

            if (message !== '' && activeSessionId) {
                input.value = ''; 
                try {
                    await fetch('/api/admin?action=send-message', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: activeSessionId, sender: 'admin', message: message })
                    });
                    loadAdminMessages();
                } catch (error) {
                    console.error("Gagal mengirim pesan:", error);
                }
            }
        }

        document.getElementById('admin-chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendAdminReply();
        });

        // Inisialisasi Awal & Auto-Refresh
        loadDash(); 
        loadChatSessions();
        setInterval(() => loadDash(true), 5000);
        setInterval(loadChatSessions, 3000); 

    </script>
</body>
</html>
