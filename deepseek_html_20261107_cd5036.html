<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dukung Kreator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        
        /* Animasi getar kalau checkbox belum dicentang */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen flex items-center justify-center p-4">
    
    <div class="glass p-8 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-blue-100">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Dukung Kreator</h1>
            <p class="text-slate-500 text-sm mt-1">Berikan dukungan terbaikmu</p>
        </div>
        
        <form id="form-donasi" class="space-y-4">
            <!-- Input Nominal dengan UI Smooth -->
            <div>
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2 block">Nominal (Rp)</label>
                <div class="relative group">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium group-focus-within:text-blue-500 transition-colors">Rp</span>
                    <input type="number" id="amount" required class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 transition-all duration-300 font-bold text-slate-800 placeholder-slate-300" placeholder="0">
                </div>
            </div>

            <!-- Input Nama & Email dengan UI Smooth -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2 block">Nama</label>
                    <input type="text" id="name" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 transition-all duration-300 text-sm" placeholder="Nama kamu">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2 block">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 transition-all duration-300 text-sm" placeholder="email@anda.com">
                </div>
            </div>

            <!-- Input Pesan -->
            <div>
                <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2 block">Pesan (Opsional)</label>
                <textarea id="message" rows="2" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10 transition-all duration-300 text-sm resize-none" placeholder="Tulis doa atau pesan..."></textarea>
            </div>
            
            <!-- Checkbox Persetujuan & Pesan Error -->
            <div class="pt-2">
                <div class="flex items-start gap-3">
                    <input type="checkbox" id="agree" class="mt-1 w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer transition-all">
                    <label for="agree" id="agree-label" class="text-xs text-slate-500 leading-relaxed cursor-pointer select-none transition-colors">Saya memahami dan menyetujui bahwa dukungan ini bersifat sukarela dan tidak dapat dikembalikan.</label>
                </div>
                <p id="error-checkbox" class="text-red-500 text-xs font-semibold mt-2 hidden">* Anda harus mencentang persetujuan ini sebelum melanjutkan.</p>
            </div>

            <!-- Ringkasan Pembayaran -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mt-4 relative overflow-hidden transition-all duration-300 hover:shadow-md">
                <div class="absolute top-0 left-0 w-1 h-full bg-blue-500 rounded-l-2xl"></div>
                <div class="flex justify-between text-sm text-slate-600 mb-2">
                    <span>Jumlah Dukungan:</span>
                    <span class="font-medium">Rp <span id="summary-amount">0</span></span>
                </div>
                <div class="flex justify-between text-sm text-slate-600 mb-3">
                    <span>Biaya Layanan (QRIS):</span>
                    <span class="font-medium">Rp <span id="summary-fee">0</span></span>
                </div>
                <div class="border-t border-slate-200 border-dashed pt-3 flex justify-between font-bold text-slate-800 text-lg">
                    <span>Total:</span>
                    <span class="text-blue-600">Rp <span id="summary-total">0</span></span>
                </div>
            </div>
            
            <!-- Tombol Submit dengan UI Smooth -->
            <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 hover:shadow-[0_8px_20px_rgba(37,99,235,0.3)] hover:-translate-y-0.5 transition-all duration-300 active:scale-[0.98] mt-4 flex items-center justify-center gap-2">
                <span>Lanjut ke Pembayaran</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
            </button>
        </form>
        
        <!-- [DIHAPUS] Bagian Login Admin sudah dihilangkan dari sini -->
        
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // --- [TAMBAHAN] LOGIKA RINGKASAN PEMBAYARAN REAL-TIME ---
            const amountInput = document.getElementById('amount');
            const summaryAmount = document.getElementById('summary-amount');
            const summaryFee = document.getElementById('summary-fee');
            const summaryTotal = document.getElementById('summary-total');

            amountInput.addEventListener('input', function() {
                let val = parseInt(this.value) || 0;
                let fee = 0; // Biaya layanan statis (bisa diubah jika ada fee dari Cashi)
                let total = val + fee;

                summaryAmount.innerText = val.toLocaleString('id-ID');
                summaryFee.innerText = fee.toLocaleString('id-ID');
                summaryTotal.innerText = total.toLocaleString('id-ID');
            });

            // [FUNGSI BARU] Untuk membatalkan transaksi ke Cashi & Supabase
            window.cancelTransaction = async function(orderId, isAuto = false, btnElement = null) {
                if (!isAuto && !confirm('Yakin ingin membatalkan transaksi ini?')) return;
                
                // Efek Loading di tombol
                let originalText = '';
                if (btnElement) {
                    originalText = btnElement.innerHTML;
                    btnElement.innerHTML = 'Membatalkan...';
                    btnElement.disabled = true;
                }

                try {
                    const res = await fetch('/api/cancel-donation', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ order_id: orderId })
                    });
                    
                    if (!res.ok) throw new Error('Gagal server');
                    
                    alert('Transaksi berhasil dibatalkan.');
                    window.location.reload();
                    
                } catch (error) {
                    console.error(error);
                    alert('Gagal membatalkan transaksi di server. Silakan coba lagi.');
                    if (btnElement) {
                        btnElement.innerHTML = originalText;
                        btnElement.disabled = false;
                    }
                }
            };

            // --- FUNGSI SUBMIT FORM DENGAN VALIDASI CHECKBOX ---
            document.getElementById('form-donasi').onsubmit = async function(e) {
                e.preventDefault(); 
                
                const checkbox = document.getElementById('agree');
                const errorMsg = document.getElementById('error-checkbox');
                const label = document.getElementById('agree-label');
                const btn = e.target.querySelector('button');

                // [TAMBAHAN] Validasi Checkbox
                if (!checkbox.checked) {
                    errorMsg.classList.remove('hidden');
                    label.classList.add('text-red-500');
                    
                    // Efek Getar
                    checkbox.parentElement.classList.add('animate-shake');
                    setTimeout(() => {
                        checkbox.parentElement.classList.remove('animate-shake');
                    }, 500);
                    
                    return; // Hentikan proses submit
                }

                // Sembunyikan error jika sudah dicentang
                errorMsg.classList.add('hidden');
                label.classList.remove('text-red-500');

                // Proses Loading Tombol (Logika Anda)
                btn.innerHTML = '<svg class="animate-spin h-5 w-5 mx-auto text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
                btn.disabled = true;

                const nominal = document.getElementById('amount').value;

                try {
                    const res = await fetch('/api/donasi', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            order_id: 'DON-' + Date.now(),
                            amount: parseInt(nominal),
                            donor_name: document.getElementById('name').value,
                            donor_email: document.getElementById('email').value,
                            message: document.getElementById('message').value
                        })
                    });

                    const data = await res.json();

                    if (res.ok && data.qr_code_url) { 
                        const now = new Date();
                        const tanggal = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                        const waktu = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';

                        document.body.innerHTML = `
                            <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 to-slate-200 p-4">
                                <div class="glass p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] text-center w-full max-w-sm border border-white">
                                    
                                    <div id="status-badge" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold mb-4 bg-amber-100 text-amber-700 border border-amber-200">
                                        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Menunggu Pembayaran
                                    </div>

                                    <h2 class="text-xl font-bold text-slate-800 mb-1">Scan QRIS</h2>
                                    <p class="text-sm text-slate-500 mb-4">Sisa Waktu: <span id="timer" class="font-bold text-red-500">10:00</span></p>
                                    
                                    <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm mb-6 inline-block">
                                        <img src="${data.qr_code_url}" alt="QRIS" class="w-56 h-56 object-contain rounded-xl">
                                    </div>
                                    
                                    <div class="text-left text-sm bg-slate-50 p-5 rounded-2xl mb-6 border border-slate-200 space-y-3">
                                        <div class="flex justify-between items-center pb-3 border-b border-slate-200 border-dashed">
                                            <span class="text-slate-500 text-xs font-semibold uppercase tracking-wider">ID Transaksi</span>
                                            <span class="font-mono font-bold text-slate-800 text-xs bg-slate-200 px-2 py-1 rounded">${data.order_id}</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="text-slate-500">Tanggal</span>
                                            <span class="font-medium text-slate-800 text-right">${tanggal}</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="text-slate-500">Waktu</span>
                                            <span class="font-medium text-slate-800">${waktu}</span>
                                        </div>
                                        <div class="flex justify-between items-center border-t border-slate-200 border-dashed pt-3 mt-1">
                                            <span class="text-slate-600 font-semibold">Total Bayar</span>
                                            <span class="font-bold text-blue-600 text-lg">Rp ${parseInt(nominal).toLocaleString('id-ID')}</span>
                                        </div>
                                    </div>

                                    <button onclick="window.cancelTransaction('${data.order_id}', false, this)" class="bg-white text-slate-600 border border-slate-200 font-medium px-6 py-3 rounded-xl w-full hover:bg-slate-50 transition-all active:scale-[0.98]">Batalkan & Kembali</button>
                                </div>
                            </div>
                        `;

                        let timeLeft = 600;
                        const timerElement = document.getElementById('timer');
                        
                        const countdown = setInterval(() => {
                            timeLeft--;
                            const minutes = Math.floor(timeLeft / 60);
                            const seconds = timeLeft % 60;
                            
                            timerElement.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                            if (timeLeft <= 0) {
                                clearInterval(countdown);
                                clearInterval(checkStatusInterval);
                                // Otomatis cancel tanpa nampilin popup konfirmasi
                                window.cancelTransaction(data.order_id, true); 
                            }
                        }, 1000);

                        const checkStatusInterval = setInterval(async () => {
                            try {
                                const statusRes = await fetch(`/api/check-status?order_id=${data.order_id}`);
                                const statusData = await statusRes.json();
                                
                                const badge = document.getElementById('status-badge');

                                if (statusData.status === 'success') {
                                    clearInterval(countdown);
                                    clearInterval(checkStatusInterval);
                                    
                                    badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold mb-4 bg-emerald-100 text-emerald-700 border border-emerald-200";
                                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Pembayaran Berhasil`;
                                    alert('Terima kasih! Pembayaran Anda telah kami terima.');
                                    window.location.reload();

                                } else if (statusData.status === 'fail') {
                                    clearInterval(countdown);
                                    clearInterval(checkStatusInterval);
                                    
                                    badge.className = "inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold mb-4 bg-red-100 text-red-700 border border-red-200";
                                    badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Transaksi Gagal`;
                                    alert('Transaksi gagal atau dibatalkan.');
                                    window.location.reload();
                                }
                            } catch (error) {
                                console.error('Gagal cek status', error);
                            }
                        }, 5000);

                    } else { 
                        alert('Pesan Sistem: ' + JSON.stringify(data));
                        btn.innerHTML = 'Lanjut ke Pembayaran'; 
                        btn.disabled = false;
                    }
                } catch (err) {
                    alert('Error Jaringan: ' + err.message);
                    btn.innerHTML = 'Lanjut ke Pembayaran';
                    btn.disabled = false;
                }
            };
        });
    </script>
</body>
</html>
