<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Animasi loading muter */
        .spinner { border: 3px solid rgba(0,0,0,0.1); width: 24px; height: 24px; border-radius: 50%; border-left-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="w-full max-w-3xl mx-auto">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Dashboard Admin</h1>
                <p class="text-slate-500 text-sm mt-1">Pantau donasi dan kelola akses</p>
            </div>
            <button id="btn-logout" class="text-sm font-semibold text-red-600 bg-red-50 hover:bg-red-100 px-4 py-2.5 rounded-xl transition-colors shadow-sm">Logout</button>
        </div>

        <!-- Form Tambah User (Modern Card) -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
            <h2 class="text-sm font-bold text-slate-800 mb-4 uppercase tracking-wider">Tambah Akses Admin Baru</h2>
            <form id="form-add-user" class="space-y-3">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="email" id="new-email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm" placeholder="Email admin baru...">
                    <input type="text" id="new-username" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm" placeholder="Username (Nama Panggilan)">
                </div>
                <button type="submit" class="w-full md:w-auto bg-blue-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-blue-700 transition-all active:scale-[0.98]">Tambah Akses</button>
            </form>
        </div>

        <!-- List Donasi (Card Layout) -->
        <div class="space-y-3">
            <h2 class="text-sm font-bold text-slate-800 mb-2 uppercase tracking-wider px-2">Riwayat Donasi</h2>
            
            <div id="donation-list" class="space-y-3">
                <!-- Loading State -->
                <div class="flex justify-center items-center py-10 bg-white rounded-2xl border border-slate-200">
                    <div class="spinner mr-3"></div>
                    <span class="text-slate-500 text-sm font-medium">Memuat data...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIKA JS -->
    <script>
        const token = localStorage.getItem('admin_token');
        if (!token) window.location.href = '/login.html';

        document.getElementById('btn-logout').onclick = () => {
            localStorage.removeItem('admin_token');
            window.location.href = '/login.html';
        };

        // --- FUNGSI LOAD DATA DONASI ---
        async function loadDash() {
            const container = document.getElementById('donation-list');
            try {
                const res = await fetch('/api/get-donations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Gagal mengambil data');
                const data = await res.json();
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="text-center py-10 bg-white rounded-2xl border border-slate-200 text-slate-400 text-sm">Belum ada donasi yang masuk.</div>';
                    return;
                }

                container.innerHTML = ''; // Kosongkan loading
                
                data.forEach(d => {
                    const isSettled = d.status === 'SETTLED';
                    const badgeClass = isSettled 
                        ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                        : 'bg-amber-50 text-amber-700 border-amber-200';
                    const dotClass = isSettled ? 'bg-emerald-500' : 'bg-amber-500';
                    
                    // Format tanggal
                    const date = new Date(d.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                    container.innerHTML += `
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <h3 class="font-bold text-slate-800 text-lg">${d.donor_name}</h3>
                                    <p class="text-xs text-slate-500">${d.donor_email}</p>
                                </div>
                                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] uppercase font-bold border ${badgeClass}">
                                    <span class="w-1.5 h-1.5 rounded-full ${dotClass}"></span>
                                    ${d.status}
                                </span>
                            </div>
                            
                            <div class="flex justify-between items-end mt-4 pt-3 border-t border-slate-100 border-dashed">
                                <div>
                                    <p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Total Donasi</p>
                                    <p class="font-bold text-blue-600 text-xl">Rp ${d.amount.toLocaleString('id-ID')}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Waktu</p>
                                    <p class="text-xs font-medium text-slate-600">${date}</p>
                                </div>
                            </div>
                            
                            ${d.message ? `
                            <div class="mt-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                <p class="text-xs text-slate-600 italic">"${d.message}"</p>
                            </div>
                            ` : ''}
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = `<div class="text-center py-10 bg-red-50 rounded-2xl border border-red-200 text-red-500 text-sm">Error: ${error.message}</div>`;
            }
        }

        // --- FUNGSI TAMBAH USER ---
        document.getElementById('form-add-user').onsubmit = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = 'Memproses...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/add-user', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ 
                        email: document.getElementById('new-email').value,
                        username: document.getElementById('new-username').value
                    })
                });
                
                if (res.ok) { 
                    alert('Akses admin berhasil ditambahkan!'); 
                    e.target.reset(); 
                } else { 
                    alert('Gagal! Mungkin email sudah terdaftar.'); 
                }
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.innerText = 'Tambah Akses';
                btn.disabled = false;
            }
        };

        // Panggil fungsi load saat halaman dibuka
        loadDash();
    </script>
</body>
</html>
