<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="w-full max-w-5xl mx-auto">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Dashboard Admin</h1>
                <p class="text-slate-500 text-sm mt-1">Pantau donasi dan kelola akses</p>
            </div>
            <button id="btn-logout" class="text-sm font-semibold text-red-600 bg-red-50 hover:bg-red-100 px-4 py-2 rounded-xl transition-colors">Logout</button>
        </div>

        <!-- Form Tambah User -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-8">
            <h2 class="text-sm font-bold text-slate-800 mb-3 uppercase tracking-wider">Tambah Akses Admin Baru</h2>
            <form id="form-add-user" class="flex flex-col md:flex-row gap-3">
                <input type="email" id="new-email" required class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm" placeholder="Masukkan email yang diizinkan...">
                <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700 transition-all active:scale-[0.98]">Tambah Akses</button>
            </form>
        </div>

        <!-- Tabel Donasi -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200">
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Donatur</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Nominal</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody id="t-body" class="divide-y divide-slate-100">
                        <!-- Data masuk sini -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="/js/dashboard.js"></script>
    <script>
        // Sedikit override styling untuk isi tabel di dashboard.js biar lebih clean
        const originalLoadDash = loadDash;
        loadDash = async function() {
            const token = localStorage.getItem('admin_token');
            const res = await fetch('/api/get-donations', { headers: { 'Authorization': `Bearer ${token}` } });
            const data = await res.json();
            const tbody = document.getElementById('t-body');
            
            tbody.innerHTML = data.length ? '' : '<tr><td colspan="3" class="text-center py-8 text-slate-400 text-sm">Belum ada data donasi masuk.</td></tr>';
            
            data.forEach(d => {
                const isSettled = d.status === 'SETTLED';
                const badgeClass = isSettled 
                    ? 'bg-emerald-100 text-emerald-700 border-emerald-200' 
                    : 'bg-amber-100 text-amber-700 border-amber-200';
                const dotClass = isSettled ? 'bg-emerald-500' : 'bg-amber-500';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4">
                            <p class="font-semibold text-slate-800">${d.donor_name}</p>
                            <p class="text-xs text-slate-500">${d.donor_email}</p>
                        </td>
                        <td class="px-6 py-4 font-bold text-slate-800">Rp ${d.amount.toLocaleString('id-ID')}</td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold border ${badgeClass}">
                                <span class="w-1.5 h-1.5 rounded-full ${dotClass}"></span>
                                ${d.status}
                            </span>
                        </td>
                    </tr>`;
            });
        };
        loadDash(); // Panggil ulang pake styling baru
    </script>
</body>
</html>
