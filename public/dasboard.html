<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- =========================================================
         LANGKAH 4: CARA DEPLOY KE VERCEL
         =========================================================
         1. Upload ke GitHub: Push semua file/folder ke repository GitHub.
         2. Import di Vercel: Buka Vercel, klik Add New -> Project, pilih repo GitHub tersebut.
         3. Set Environment Variables: Buka tab Environment Variables dan masukkan:
            - SUPABASE_URL
            - SUPABASE_ANON_KEY
            - SUPABASE_SERVICE_KEY
            - WEBHOOK_SECRET
         4. Deploy: Klik tombol Deploy.
         5. Webhook URL: Masukkan URL https://nama-project.vercel.app/api/webhook ke Payment Gateway.
         ========================================================= 
    -->
</head>
<body class="bg-gray-50 min-h-screen p-8 font-sans">
    <div class="w-full max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Dashboard Admin</h1>
            <button id="btn-logout" class="text-sm text-red-500 font-semibold">Logout</button>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <form id="form-add-user" class="flex gap-2">
                <input type="email" id="new-email" required class="flex-1 px-4 py-2 bg-gray-50 border border-gray-200 rounded-xl outline-none" placeholder="Tambah email yang boleh login...">
                <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-medium hover:bg-blue-700">Tambah</button>
            </form>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b border-gray-100">
                    <tr>
                        <th class="px-6 py-4 text-sm font-medium text-gray-500">Donatur</th>
                        <th class="px-6 py-4 text-sm font-medium text-gray-500">Nominal</th>
                        <th class="px-6 py-4 text-sm font-medium text-gray-500">Status</th>
                    </tr>
                </thead>
                <tbody id="t-body" class="divide-y divide-gray-100"></tbody>
            </table>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
