<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dukung Kreator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100 w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-6">Dukung Kreator</h1>
        
        <form id="form-donasi" class="space-y-4">
            <div>
                <label class="text-sm font-medium text-gray-700">Nominal (Rp)</label>
                <input type="number" id="amount" required class="w-full mt-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: 10000">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="name" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nama">
                <input type="email" id="email" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Email">
            </div>
            <textarea id="message" rows="2" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="Pesan (Opsional)"></textarea>
            
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition">Dukung via QRIS</button>
        </form>
        <p class="text-center text-sm text-gray-400 mt-4 cursor-pointer hover:text-blue-600" onclick="window.location.href='/login.html'">Login Admin</p>
    </div>

    <script>
        // [TAMBAHAN] Dibungkus DOMContentLoaded agar HTML siap sebelum JS jalan
        document.addEventListener("DOMContentLoaded", function() {
            
            document.getElementById('form-donasi').onsubmit = async function(e) {
                e.preventDefault(); 
                
                const btn = e.target.querySelector('button');
                btn.innerText = 'Memproses...';
                btn.disabled = true;

                const nominal = document.getElementById('amount').value;

                // [TAMBAHAN] Pengaman agar tidak loading selamanya (Timeout 10 Detik)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); 

                try {
                    const res = await fetch('/api/donasi', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal: controller.signal, // [TAMBAHAN] Pasang pengaman di sini
                        body: JSON.stringify({
                            order_id: 'DON-' + Date.now(),
                            amount: parseInt(nominal),
                            donor_name: document.getElementById('name').value,
                            donor_email: document.getElementById('email').value,
                            message: document.getElementById('message').value
                        })
                    });

                    clearTimeout(timeoutId); // [TAMBAHAN] Hentikan timer kalau sukses
                    const data = await res.json();

                    if (res.ok && data.qr_code_url) { 
                        
                        const now = new Date();
                        const tanggal = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                        const waktu = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';

                        document.body.innerHTML = `
                            <div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
                                <div class="bg-white p-6 rounded-3xl shadow-xl text-center w-full max-w-sm border border-gray-100">
                                    <h2 class="text-xl font-bold mb-1">Scan QRIS</h2>
                                    <p class="text-sm text-gray-500 mb-4">Selesaikan pembayaran Anda</p>
                                    
                                    <img src="${data.qr_code_url}" alt="QRIS" class="w-64 h-64 mx-auto mb-6 border p-2 rounded-xl shadow-sm">
                                    
                                    <div class="text-left text-sm bg-gray-50 p-4 rounded-2xl mb-6 border border-gray-100 space-y-3">
                                        <div class="flex justify-between items-center border-b border-gray-200 pb-2">
                                            <span class="text-gray-500">ID Transaksi</span>
                                            <span class="font-mono font-semibold text-gray-800 text-xs bg-gray-200 px-2 py-1 rounded">${data.order_id}</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="text-gray-500">Tanggal</span>
                                            <span class="font-medium text-gray-800 text-right">${tanggal}</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="text-gray-500">Waktu</span>
                                            <span class="font-medium text-gray-800">${waktu}</span>
                                        </div>
                                        <div class="flex justify-between items-center border-t border-gray-200 pt-2 mt-1">
                                            <span class="text-gray-600 font-medium">Total Bayar</span>
                                            <span class="font-bold text-blue-600 text-lg">Rp ${parseInt(nominal).toLocaleString('id-ID')}</span>
                                        </div>
                                    </div>

                                    <button onclick="window.location.reload()" class="bg-gray-100 text-gray-700 font-medium px-6 py-3 rounded-xl w-full hover:bg-gray-200 transition">Kembali ke Form</button>
                                </div>
                            </div>
                        `;
                    } else { 
                        alert('Pesan Sistem: ' + JSON.stringify(data));
                        btn.innerText = 'Dukung via QRIS'; 
                        btn.disabled = false;
                    }
                } catch (err) {
                    clearTimeout(timeoutId); // [TAMBAHAN] Hentikan timer kalau error
                    
                    // [TAMBAHAN] Pesan error yang lebih jelas
                    if (err.name === 'AbortError') {
                        alert('Error: Server terlalu lama merespon (Timeout). Periksa koneksi atau server Vercel/Cashi.');
                    } else {
                        alert('Error Jaringan: ' + err.message);
                    }
                    
                    btn.innerText = 'Dukung via QRIS';
                    btn.disabled = false;
                }
            };

        });
    </script>
</body>
</html>
